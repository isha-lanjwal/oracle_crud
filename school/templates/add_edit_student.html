<h2>Add Student</h2>
<form method="POST">
  {% csrf_token %}
  <input type="text" name="name" placeholder="Name" value="{{ student.name|default:'' }}" required>
  <input type="number" name="age" placeholder="Age" value="{{ student.age|default:'' }}" required>
  {{student.course}}
  <select name="course">
    {% for c in courses %}
      <option value="{{ c.id }}" {% if student.course.id == c.id %}selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Add</button>
</form>
